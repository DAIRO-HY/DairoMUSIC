<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {{template include/head}}
    <title>轮播图</title>
</head>
<body>
{{template include/layout}}
<main class="app-main">
    <div class="app-card">
        <div class="app-toolbar">
            <div class="text-secondary small">APP发现页顶部的轮播图,按排序号从小到大显示,禁用的不显示</div>
            <a class="btn btn-primary ms-auto" href="/admin/swiper_edit.html"><i class="bi bi-plus-lg me-1"></i>添加轮播</a>
        </div>
        <div id="table"></div>
    </div>
</main>
<script>
    const SWIPER_TYPES = {1: "推荐歌单", 2: "推荐单曲", 3: "拨打电话", 4: "跳转网页"}
    const table = new PageTable({
        el: "#table",
        url: "/admin/api/swiper/list",
        paging: false,
        columns: [
            {title: "图片", render: it => it.imageUrl ? `<img src="${escapeHtml(it.imageUrl)}" class="rounded object-fit-cover" style="width:120px;height:60px" alt="" loading="lazy">` : ""},
            {title: "名称", render: it => `<a href="/admin/swiper_edit.html?id=${it.id}" class="text-decoration-none">${ellipsis(it.name, 260)}</a>`},
            {title: "类型", render: it => SWIPER_TYPES[it.swiperType] || ""},
            {
                title: "内容", render: it => {
                    if (it.dataText == null) {
                        return badge("歌单或歌曲已经不存在", "danger")
                    }
                    const id = it.swiperType <= 2 ? `<span class="text-secondary small ms-1">ID:${escapeHtml(it.data)}</span>` : ""
                    return `<div class="d-flex align-items-center">${ellipsis(it.dataText, 280)}${id}</div>`
                }
            },
            {title: "排序号", data: "sort"},
            {title: "状态", render: it => it.state === 1 ? badge("启用", "success") : badge("禁用")}
        ],
        actions: [
            {
                icon: "bi-trash3", title: "删除", danger: true, onClick: it => confirmDo(`确定要删除轮播【${it.name}】吗?`, () => {
                    $.ajaxByData("/admin/api/swiper/delete").add("id", it.id).success(() => table.load()).post()
                })
            }
        ]
    })
    $(function () {
        table.load()
    })
</script>
</body>
</html>
