<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {{template include/head}}
    <meta name="menu" content="/admin/admin_list.html">
    <title>编辑管理员</title>
</head>
<body>
{{template include/layout}}
<main class="app-main">
    <div class="app-card">
        <form id="form" class="app-form" action="/admin/api/admin/edit" onsubmit="onSubmitClick();return false;">
            <input type="hidden" name="id">
            <div class="mb-3">
                <label class="form-label">登录名</label>
                <input name="name" class="form-control" autocomplete="off" style="max-width: 280px">
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input name="pwd" class="form-control" type="password" autocomplete="new-password" placeholder="6~32位" style="max-width: 280px">
            </div>
            <div class="mb-3">
                <label class="form-label">姓名</label>
                <input name="realName" class="form-control" autocomplete="off" style="max-width: 280px">
            </div>
            <div class="mb-3">
                <label class="form-label">角色</label>
                <select name="roleId" class="form-select" style="max-width: 280px"></select>
            </div>
            <div class="mb-3">
                <label class="form-label d-block">状态</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="state" value="1" id="state1">
                    <label class="form-check-label" for="state1">有效</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="state" value="0" id="state0">
                    <label class="form-check-label" for="state0">无效</label>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">备注</label>
                <textarea name="remark" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-4 text-secondary small" id="dateInfo"></div>
            <button type="submit" class="btn btn-primary px-4">保存</button>
            <a class="btn btn-light ms-2" href="/admin/admin_list.html">返回</a>
        </form>
    </div>
</main>
<script>
    $(function () {
        $.ajaxByData("/admin/api/admin/roles").success(roles => {
            fillOptions("select[name='roleId']", roles)
            $.ajaxByData("/admin/api/admin/detail").add("id", getParam("id", "0")).success(data => {
                if (data.id === 0) {
                    data.roleId = roles.length > 0 ? roles[0].value : ""
                } else {
                    $("input[name='pwd']").attr("placeholder", "不修改请留空")
                    $("#dateInfo").text(`开通时间:${formatTime(data.date)}  最后登录:${formatTime(data.lastLoginTime) || "从未登录"}`)
                    document.title = "编辑管理员 - " + data.name
                }
                $("#form").bindValue(data)
            }).get()
        }).get()
    })

    function onSubmitClick() {
        $("#form").ajaxByForm().success(() => {
            location.href = "/admin/admin_list.html"
        }).post()
    }
</script>
</body>
</html>
