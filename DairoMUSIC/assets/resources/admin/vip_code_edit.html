<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {{template include/head}}
    <meta name="menu" content="/admin/vip_code_list.html">
    <title>兑换码明细</title>
</head>
<body>
{{template include/layout}}
<main class="app-main">
    <div class="app-card">
        <div class="app-card-title">兑换码 <span id="stateBadge" class="ms-1"></span></div>
        <div class="row g-3 small" style="max-width: 760px">
            <div class="col-12 col-md-6">
                <div class="text-secondary">卡号</div>
                <div id="cardNo" class="font-monospace fs-6"></div>
            </div>
            <div class="col-12 col-md-6">
                <div class="text-secondary">卡密</div>
                <div id="cardPwd" class="font-monospace fs-6 text-break"></div>
            </div>
            <div class="col-6 col-md-3">
                <div class="text-secondary">批次号</div>
                <div id="batchNo" class="font-monospace"></div>
            </div>
            <div class="col-6 col-md-3">
                <div class="text-secondary">生成时间</div>
                <div id="date"></div>
            </div>
            <div class="col-6 col-md-3">
                <div class="text-secondary">兑换的会员</div>
                <div id="user">-</div>
            </div>
            <div class="col-6 col-md-3">
                <div class="text-secondary">兑换时间</div>
                <div id="useTime">-</div>
            </div>
        </div>
    </div>

    <form id="form" class="app-card app-form" action="/admin/api/vip_code/edit" onsubmit="onSubmitClick();return false;">
        <input type="hidden" name="id">
        <div class="row g-3" style="max-width: 760px">
            <div class="col-6 col-md-3">
                <label class="form-label">VIP时长</label>
                <select name="forever" class="form-select" data-validity onchange="onForeverChange()">
                    <option value="0">按天数</option>
                    <option value="1">永久</option>
                </select>
            </div>
            <div class="col-6 col-md-3" id="daysBox">
                <label class="form-label">天数</label>
                <input name="days" class="form-control" type="number" min="1" max="36500" data-validity>
            </div>
            <div class="col-12 col-md-5">
                <label class="form-label">兑换码有效期 <span class="text-secondary small">(过了这一天不能兑换)</span></label>
                <input name="expireDate" class="form-control" type="date" data-validity>
            </div>
            <div class="col-12">
                <div id="validityTip" class="text-secondary small d-none">已经使用或作废的兑换码不能修改VIP时长和有效期</div>
            </div>
            <div class="col-12 col-md-4">
                <label class="form-label">标签 <span class="text-secondary small">(最多10个字)</span></label>
                <input name="tag" class="form-control" maxlength="10" autocomplete="off">
            </div>
            <div class="col-12">
                <label class="form-label">备注 <span class="text-secondary small">(最多3000个字,<span id="memoCount">0</span>/3000)</span></label>
                <textarea name="memo" class="form-control" rows="8" maxlength="3000" oninput="onMemoInput()"></textarea>
            </div>
        </div>
        <div class="mt-4 d-flex flex-wrap gap-2">
            <button type="submit" class="btn btn-primary px-4">保存</button>
            <button type="button" id="voidBtn" class="btn btn-outline-danger d-none" onclick="onVoidClick()"><i class="bi bi-slash-circle me-1"></i>作废</button>
            <a class="btn btn-light" href="/admin/vip_code_list.html">返回</a>
        </div>
    </form>
</main>
<script>
    let detail = {}

    /** 卡号每4位一组显示 */
    const cardNoText = cardNo => cardNo.replace(/(.{4})(?=.)/g, "$1 ")

    /** 日期 yyyy-MM-dd */
    function formatDate(millis) {
        const d = new Date(millis)
        const pad = it => String(it).padStart(2, "0")
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`
    }

    function codeStateBadge(it) {
        if (it.state === 1) {
            return badge("已使用", "success")
        }
        if (it.state === 2) {
            return badge("已作废", "danger")
        }
        return it.expired ? badge("已过期", "warning") : badge("未使用", "primary")
    }

    $(function () {
        load()
    })

    function load() {
        $.ajaxByData("/admin/api/vip_code/detail").add("id", getParam("id", "0")).success(data => {
            detail = data
            $("#stateBadge").html(codeStateBadge(data))
            $("#cardNo").text(cardNoText(data.cardNo))
            $("#cardPwd").text(data.cardPwd)
            $("#batchNo").text(data.batchNo)
            $("#date").text(formatTime(data.date))
            if (data.userId != null) {
                $("#user").html(`<a href="/admin/user_edit.html?id=${data.userId}" class="text-decoration-none">${escapeHtml(data.userEmail || data.userName || "没有邮箱")}</a> <span class="text-secondary">ID:${data.userId}</span>`)
            }
            $("#useTime").text(data.useTime ? formatTime(data.useTime) : "-")
            $("input[name='id']").val(data.id)
            $("input[name='tag']").val(data.tag || "")
            $("textarea[name='memo']").val(data.memo || "")
            $("select[name='forever']").val(data.days === 0 ? "1" : "0")
            $("input[name='days']").val(data.days === 0 ? 30 : data.days)
            $("input[name='expireDate']").val(formatDate(data.expireTime))
            onForeverChange()
            onMemoInput()

            //VIP时长、有效期只有未使用的可以修改
            const editable = data.state === 0
            $("[data-validity]").prop("disabled", !editable)
            $("#validityTip").toggleClass("d-none", editable)
            $("#voidBtn").toggleClass("d-none", !editable)
        }).get()
    }

    function onForeverChange() {
        $("#daysBox").toggleClass("d-none", $("select[name='forever']").val() === "1")
    }

    function onMemoInput() {
        $("#memoCount").text($("textarea[name='memo']").val().length)
    }

    function onSubmitClick() {
        $("#form").ajaxByForm().success(() => {
            alert("已保存")
            load()
        }).post()
    }

    function onVoidClick() {
        confirmDo("确定要作废这个兑换码吗?作废之后不能恢复", () => {
            $.ajaxByData("/admin/api/vip_code/void").add("ids", detail.id).success(() => load()).post()
        })
    }
</script>
</body>
</html>
