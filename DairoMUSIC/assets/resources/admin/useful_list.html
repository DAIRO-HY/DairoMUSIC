<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {{template include/head}}
    <title>推荐分组</title>
</head>
<body>
{{template include/layout}}
<main class="app-main">
    <div class="app-card">
        <div class="app-toolbar">
            <div class="text-secondary small">APP发现页的推荐歌单,一个分组显示一组歌单,歌单从会员的歌单里选择,歌单里的歌曲由所属的会员维护</div>
            <a class="btn btn-primary ms-auto" href="/admin/useful_edit.html"><i class="bi bi-plus-lg me-1"></i>添加分组</a>
        </div>
        <div id="table"></div>
    </div>
</main>
<script>
    const SHOW_TYPES = {1: "表格", 2: "横向滚动"}
    const table = new PageTable({
        el: "#table",
        url: "/admin/api/useful/list",
        paging: false,
        columns: [
            {title: "分组名", render: it => `<a href="/admin/useful_edit.html?id=${it.id}" class="text-decoration-none">${escapeHtml(it.name || "(没有分组名)")}</a>`},
            {title: "显示方式", render: it => SHOW_TYPES[it.showType] || ""},
            {
                title: "歌单", render: it => it.favorites.length === 0
                    ? badge("歌单都已经不存在,APP不显示这个分组", "danger")
                    : `<div class="d-flex align-items-center">${ellipsis(it.favorites.map(f => f.name).join("、"), 520)}<span class="text-secondary small ms-1 text-nowrap">共${it.favorites.length}个</span></div>`
            },
            {title: "排序号", data: "sort"},
            {title: "状态", render: it => it.state === 1 ? badge("启用", "success") : badge("禁用")}
        ],
        actions: [
            {
                icon: "bi-trash3", title: "删除", danger: true, onClick: it => confirmDo(`确定要删除分组【${it.name || ""}】吗?分组里的歌单不会删除。`, () => {
                    $.ajaxByData("/admin/api/useful/delete").add("id", it.id).success(() => table.load()).post()
                })
            }
        ]
    })
    $(function () {
        table.load()
    })
</script>
</body>
</html>
