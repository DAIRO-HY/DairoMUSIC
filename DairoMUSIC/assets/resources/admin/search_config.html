<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {{template include/head}}
    <script src="/static/js/software.js"></script>
    <title>采集服务配置</title>
</head>
<body>
{{template include/layout}}
<main class="app-main">
    <form id="form" action="/admin/api/search_config/save" onsubmit="onSubmitClick();return false;">
        <div class="app-card">
            <div id="enableTip" class="alert py-2 small mb-3"></div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="builtin" value="1" id="builtin1" onchange="onModeChange()">
                <label class="form-check-label" for="builtin1">内置采集服务 <span class="text-secondary small">(推荐。由DairoMUSIC安装和运行)</span></label>
            </div>
            <div class="form-check mt-1">
                <input class="form-check-input" type="radio" name="builtin" value="0" id="builtin0" onchange="onModeChange()">
                <label class="form-check-label" for="builtin0">外部采集服务 <span class="text-secondary small">(使用自己部署的DairoMUSIC-Search)</span></label>
            </div>
        </div>

        <div class="app-card" data-mode="builtin">
            <div class="app-card-title">安装</div>
            <div id="software"></div>
            <div class="text-secondary small mt-2">
                安装包在 <a href="https://github.com/DAIRO-HY/DairoMUSIC-Search/releases" target="_blank">GitHub Releases</a> 下载,选择当前系统的版本。
                采集服务还需要 yt-dlp、deno、ffmpeg、ffprobe,在 <a href="/admin/software.html">依赖软件</a> 里安装
            </div>
            <div class="mt-2 small" id="depends"></div>
        </div>

        <div class="app-card" data-mode="builtin">
            <div class="app-card-title">内置采集服务设置 <span class="text-secondary small fw-normal">(不填时使用默认值,修改后自动重启采集服务)</span></div>
            <div class="app-form">
                <div class="row g-3">
                    <div class="col-4">
                        <label class="form-label">端口</label>
                        <input name="port" class="form-control" type="number" min="1" max="65535" id="port">
                    </div>
                    <div class="col-4">
                        <label class="form-label">同时下载数量</label>
                        <input name="threadCount" class="form-control" type="number" min="1" max="16" placeholder="1">
                    </div>
                    <div class="col-12">
                        <label class="form-label">数据目录 <span class="text-secondary small">(下载的缓存、cookie等)</span></label>
                        <input name="dataDir" class="form-control" id="dataDir" autocomplete="off">
                    </div>
                </div>
            </div>
        </div>

        <div class="app-card" data-mode="external">
            <div class="app-card-title">外部采集服务</div>
            <div class="app-form">
                <label class="form-label">采集服务地址 <span class="text-secondary small">(DairoMUSIC调用采集服务的接口,同一台机器或内网时用内网地址)</span></label>
                <input name="url" class="form-control" placeholder="http://127.0.0.1:8021" autocomplete="off">
            </div>
        </div>

        <div class="app-card">
            <div class="app-card-title">客户端访问方式 <span class="text-secondary small fw-normal">(APP试听还没有收藏的歌曲、视频时访问的地址)</span></div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="publicMode" value="proxy" id="publicModeProxy" onchange="onModeChange()">
                <label class="form-check-label" for="publicModeProxy">通过DairoMUSIC代理 <span class="text-secondary small">(推荐。和访问DairoMUSIC使用同一个域名,不需要再开放采集服务的端口)</span></label>
            </div>
            <div class="form-check mt-1">
                <input class="form-check-input" type="radio" name="publicMode" value="direct" id="publicModeDirect" onchange="onModeChange()">
                <label class="form-check-label" for="publicModeDirect">直接访问采集服务</label>
            </div>
            <div class="text-secondary small mt-2" data-public="proxy">地址如: <code id="proxyExample"></code></div>
            <div class="app-form mt-3" data-public="direct">
                <label class="form-label">采集服务对外的地址</label>
                <input name="publicUrl" class="form-control" id="publicUrl" autocomplete="off">
                <div class="text-secondary small mt-1" id="publicUrlTip"></div>
            </div>
        </div>

        <div class="mt-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">保存</button>
            <button type="button" class="btn btn-outline-primary" onclick="onTestClick()">测试连接</button>
        </div>
    </form>

    <div class="app-card mt-3">
        <div class="app-card-title">YouTube Cookie <span class="text-secondary small fw-normal">(YouTube要求登录验证时需要,Netscape格式)</span></div>
        <textarea id="cookie" class="form-control font-monospace small" rows="5" placeholder="# Netscape HTTP Cookie File"></textarea>
        <button class="btn btn-outline-primary btn-sm mt-2" type="button" onclick="onCookieClick()">上传Cookie</button>
    </div>
</main>
<script>
    let detail = {}

    $(function () {
        new SoftwareCard("#software", "search")
        $("#proxyExample").text(location.origin + "/proxy/dairo-search/d/...")
        load()
        loadDepends()
    })

    function load() {
        $.ajaxByData("/admin/api/search_config/detail").success(data => {
            detail = data
            $("#form").bindValue(data)
            $("#enableTip").toggleClass("alert-success", data.enable).toggleClass("alert-warning", !data.enable)
                .html(data.enable
                    ? `已启用歌曲采集(DairoMUSIC-Search 从YouTube搜索和采集歌曲、视频)。在 <a href="/admin/system_config.html">系统配置</a> 里可以关闭`
                    : `还没有启用歌曲采集,这里的设置暂时不生效。请在 <a href="/admin/system_config.html">系统配置</a> 里开启`)
            $(`input[name=builtin][value=${data.builtin ? 1 : 0}]`).prop("checked", true)
            $("#port").attr("placeholder", data.defaultPort)
            $("#dataDir").attr("placeholder", data.defaultDataDir)
            onModeChange()
        }).get()
    }

    /**
     * 依赖软件的状态
     */
    function loadDepends() {
        const keys = ["yt-dlp", "deno", "ffmpeg", "ffprobe"]
        const html = []
        let count = 0
        keys.forEach((key, i) => {
            $.getJSON(`/admin/api/software/${key}/info`).done(info => {
                html[i] = info.version
                    ? `<span class="badge text-bg-success me-1">${info.name} ${$("<i>").text(info.version.substring(0, 40)).html()}</span>`
                    : `<span class="badge text-bg-danger me-1">${info.name} 不可用</span>`
            }).fail(() => {
                html[i] = ""
            }).always(() => {
                count++
                if (count === keys.length) {
                    $("#depends").html(html.join(""))
                }
            })
        })
    }

    function onModeChange() {
        const builtin = $("input[name=builtin]:checked").val() === "1"
        $("[data-mode=builtin]").toggle(builtin)
        $("[data-mode=external]").toggle(!builtin)
        const mode = $("input[name=publicMode]:checked").val()
        $("[data-public=proxy]").toggle(mode !== "direct")
        $("[data-public=direct]").toggle(mode === "direct")
        const port = $("#port").val() || detail.defaultPort
        $("#publicUrl").attr("placeholder", builtin ? `${location.protocol}//${location.hostname}:${port}` : "如 https://collect.example.com")
        $("#publicUrlTip").text(builtin
            ? "为空时使用访问DairoMUSIC的主机名加上采集服务的端口,需要开放采集服务的端口"
            : "为空时和采集服务地址相同")
    }

    function onSubmitClick() {
        $("#form").ajaxByForm().success(() => {
            load()
            alert("已保存")
        }).post()
    }

    function onTestClick() {
        $.ajaxByData("/admin/api/search_config/test").success(text => alert(text)).post()
    }

    function onCookieClick() {
        $.ajaxByData("/admin/api/search_config/cookie").add("cookie", $("#cookie").val()).success(() => {
            $("#cookie").val("")
            alert("已上传")
        }).post()
    }
</script>
</body>
</html>
