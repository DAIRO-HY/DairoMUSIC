<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {{template /include/public-head}}
    <title>DairoMUSIC 歌曲分享</title>
    <style>
        .cover {
            width: 220px;
            height: 220px;
            border-radius: 20px;
            object-fit: cover;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .5);
        }

        .cover-empty {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            color: rgba(255, 255, 255, .5);
            background: rgba(255, 255, 255, .08);
        }

        audio {
            width: 100%;
        }
    </style>
</head>
<body class="d-flex align-items-center py-4 px-3">
<div class="public-card w-100 text-center">
    <div id="content" class="d-none">
        <div id="cover"></div>
        <h1 id="name" class="fs-4 fw-semibold mt-4 mb-1 text-white text-break"></h1>
        <div id="artist" class="text-secondary"></div>
        <div id="player" class="mt-4"></div>
        <div id="download" class="mt-3"></div>
    </div>
    <div id="message" class="py-5 text-secondary">加载中…</div>
    <hr class="border-secondary my-4">
    <a class="btn btn-outline-light btn-sm" href="/download.html"><i class="bi bi-phone me-1"></i>下载 DairoMUSIC App</a>
</div>
<script>
    function text(str) {
        return $("<div>").text(str == null ? "" : str).html()
    }

    function formatSize(size) {
        return size >= 1024 * 1024 ? (size / 1024 / 1024).toFixed(2) + "MB" : (size / 1024).toFixed(0) + "KB"
    }

    $(function () {
        const id = new URLSearchParams(location.search).get("id")
        $.getJSON("/api/public/music", {id: id}).done(music => {
            document.title = (music.name || "歌曲分享") + " - DairoMUSIC"
            $("#cover").html(music.logo
                ? `<img class="cover" src="${text(music.logo)}" alt="">`
                : `<span class="cover cover-empty"><i class="bi bi-music-note-beamed"></i></span>`)
            $("#name").text(music.name || "")
            $("#artist").text(music.artist || "未知歌手")
            //不超过320k的最高音质,都超过时用最低音质(files按比特率从低到高排序)
            const files = (music.files || []).filter(it => it.url)
            const file = files.filter(it => (it.bitRate || 0) <= 320).pop() || files[0]
            if (file) {
                $("#player").html(`<audio controls preload="metadata" src="${text(file.url)}"></audio>`)
                const fileName = `${music.name}.${file.format}`
                $("#download").html(`<a class="btn btn-accent px-4" href="${text(file.url)}" download="${text(fileName)}"><i class="bi bi-download me-1"></i>下载 (${formatSize(file.size)})</a>`)
            } else {
                $("#player").html(`<div class="text-secondary small">歌曲正在准备中,请稍后再来</div>`)
            }
            $("#message").addClass("d-none")
            $("#content").removeClass("d-none")
        }).fail(() => {
            $("#message").text("歌曲不存在或已被删除")
        })
    })
</script>
</body>
</html>
